        <p>爱恋真的是美好的，别人总说恋爱会让人变傻，我想，并不是变傻，只是我唯愿在你面前展示我的天真和懵懂<br />
我变得很奇怪，下雨天会想你，国王看的所有关于雨天的电影与歌曲一幕幕浮现在我眼前<br />
我想我终于懂，创作者的初衷<br />
我终于感受到了这种憧憬与悸动<br />
下雨天想你，一个人散步想你，吃饭会想你<br />
我这颗冰冻已久的心，因为你的出现开始慢慢融化，变成了幸福的泪水和热切的真心<br />
我依旧是我，但因为你的出现变得更加柔软<br />
我该怎么&hellip;</p>
